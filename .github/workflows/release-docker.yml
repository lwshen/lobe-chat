name: Publish Docker Image
permissions:
  contents: read

on:
  workflow_dispatch: {}
  release:
    types: [published]
  push:
  repository_dispatch:
    types: [ new-commit ]

concurrency:
  # mirror builds share a ref (repository_dispatch always runs on the default branch), so key
  # them on the upstream tag instead — otherwise they queue behind each other
  group: ${{ github.event.client_payload.ref || github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/lwshen/lobe-chat
  # Set only for upstream-mirror builds dispatched by sync-upstream-release.yml. Read through
  # `env` rather than the raw context so an absent payload is a plain empty string.
  MIRROR_REF: ${{ github.event.client_payload.ref }}
  MIRROR_VERSION: ${{ github.event.client_payload.version }}
  MIRROR_PRERELEASE: ${{ github.event.client_payload.prerelease }}
  # only the newest release of a dispatch batch may move `canary` / `latest`
  MIRROR_MOVING: ${{ github.event.client_payload.moving }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} Image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout base
        uses: actions/checkout@v6
        with:
          # a mirror build compiles upstream's code at the released tag; that tag deliberately
          # never lands in this fork, so check it out straight from upstream
          repository: ${{ env.MIRROR_REF != '' && 'lobehub/lobehub' || github.repository }}
          ref: ${{ env.MIRROR_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # first three lines: branch pushes and this fork's own `release: published`.
          # last three: upstream mirror builds arriving as `repository_dispatch`.
          # `latest` is gated on the event, not just on `prerelease`: outside a release event
          # `github.event.release.prerelease` is null, so a bare `!` would tag every branch
          # push and every mirrored nightly as `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch,enable=${{ env.MIRROR_VERSION == '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=canary,enable=${{ contains(github.event.release.tag_name, '-canary.') }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event.release.prerelease == true }}
            type=raw,value=${{ env.MIRROR_VERSION }},enable=${{ env.MIRROR_VERSION != '' }}
            type=raw,value=canary,enable=${{ env.MIRROR_MOVING == 'true' && contains(env.MIRROR_REF, '-canary.') }}
            type=raw,value=latest,enable=${{ env.MIRROR_MOVING == 'true' && env.MIRROR_PRERELEASE != 'true' }}

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get commit SHA
        if: github.ref == 'refs/heads/main'
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and export
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHA=${{ steps.vars.outputs.sha_short }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout base
        uses: actions/checkout@v6

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # first three lines: branch pushes and this fork's own `release: published`.
          # last three: upstream mirror builds arriving as `repository_dispatch`.
          # `latest` is gated on the event, not just on `prerelease`: outside a release event
          # `github.event.release.prerelease` is null, so a bare `!` would tag every branch
          # push and every mirrored nightly as `latest`.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch,enable=${{ env.MIRROR_VERSION == '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=canary,enable=${{ contains(github.event.release.tag_name, '-canary.') }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event.release.prerelease == true }}
            type=raw,value=${{ env.MIRROR_VERSION }},enable=${{ env.MIRROR_VERSION != '' }}
            type=raw,value=canary,enable=${{ env.MIRROR_MOVING == 'true' && contains(env.MIRROR_REF, '-canary.') }}
            type=raw,value=latest,enable=${{ env.MIRROR_MOVING == 'true' && env.MIRROR_PRERELEASE != 'true' }}

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # 过滤掉带 v 前缀的 tag（如 lobehub/lobehub:v2.1.29），只保留无 v 前缀的版本号和 latest
          TAGS=$(jq -cr '.tags | map(select(test(":v\\d") | not)) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $TAGS \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
